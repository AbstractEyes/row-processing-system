[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "row-processing-system"
version = "0.1.0"
description = "Controller that writes, checks, reviews and ships dataset rows through model APIs, with resumable state."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=2.6,<3",
    "openai>=3.46,<4",
    "google-genai>=3.0,<4",
    "huggingface_hub>=2.4,<3",
    "Pillow>=13.0,<14",
    "datasketch>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=9.2,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rps = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
